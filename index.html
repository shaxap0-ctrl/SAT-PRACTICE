.pos{

.translation{

/* =========================================================
   STATE
========================================================= */

let allWords = new Set();
let wordData = new Map();

let voices = [];

const WORD_LIST_URL =
"https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt";


/* =========================================================
   VOICE SYSTEM
========================================================= */

function loadVoices(){

    if(!("speechSynthesis" in window)){
        return;
    }

    voices = speechSynthesis.getVoices();

}

loadVoices();

if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged = () => {
        loadVoices();
    };

}


/* Best voice for US */

function getUSVoice(){

    if(!voices.length) return null;

    const exact = voices.filter(v =>
        v.lang.toLowerCase() === "en-us"
    );

    const preferredNames = [
        "Google US English",
        "Microsoft Zira",
        "Samantha",
        "Alex",
        "Karen",
        "Ava",
        "Jenny",
        "Aria"
    ];

    for(const name of preferredNames){

        const found = exact.find(v =>
            v.name.toLowerCase().includes(name.toLowerCase())
        );

        if(found) return found;
    }

    if(exact.length) return exact[0];

    return voices.find(v =>
        v.lang.toLowerCase().startsWith("en-us")
    ) || null;
}


/* Best voice for UK */

function getUKVoice(){

    if(!voices.length) return null;

    const exact = voices.filter(v =>
        v.lang.toLowerCase() === "en-gb"
    );

    const preferredNames = [
        "Google UK English Female",
        "Google UK English Male",
        "Daniel",
        "Kate",
        "Serena",
        "Libby",
        "Ryan",
        "Oliver"
    ];

    for(const name of preferredNames){

        const found = exact.find(v =>
            v.name.toLowerCase().includes(name.toLowerCase())
        );

        if(found) return found;
    }

    if(exact.length) return exact[0];

    return voices.find(v =>
        v.lang.toLowerCase().startsWith("en-gb")
    ) || null;
}


/* =========================================================
   PRONUNCIATION
========================================================= */

function speakWord(word, accent){

    if(!("speechSynthesis" in window)){

        alert(
            "Your browser does not support speech synthesis. Please use Chrome, Edge, Safari or another modern browser."
        );

        return;
    }

    /*
       IMPORTANT:
       Cancel previous speech first.
       This prevents old words waiting in the queue.
    */

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(word);

    let voice = null;

    if(accent === "US"){

        voice = getUSVoice();

        utterance.lang = "en-US";

    }else{

        voice = getUKVoice();

        utterance.lang = "en-GB";
    }

    if(voice){

        utterance.voice = voice;

    }

    /*
       Natural speaking speed.
       Not too slow.
       Not robotic.
    */

    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;

    speechSynthesis.speak(utterance);
}


/* =========================================================
   NORMALIZE SEARCH
========================================================= */

function normalizeWord(text){

    return text
        .toLowerCase()
        .trim()
        .replace(/[’']/g,"")
        .replace(/\s+/g," ");

}


/* =========================================================
   LOAD WORD BANK
========================================================= */

async function loadWordBank(){

    const status =
        document.getElementById("status");

    /*
       Add guaranteed core words first.
    */

    Object.keys(CORE_WORDS).forEach(word => {

        allWords.add(word);
        wordData.set(word,CORE_WORDS[word]);

    });


    try{

        status.textContent =
            "Loading large English word bank...";

        const response =
            await fetch(WORD_LIST_URL);

        if(!response.ok){
            throw new Error("Word list failed");
        }

        const text =
            await response.text();

        const words =
            text.split(/\r?\n/);

        for(const raw of words){

            const word =
                raw.trim().toLowerCase();

            if(
                word &&
                /^[a-z]+$/.test(word)
            ){

                allWords.add(word);

            }

        }

        status.textContent =
            `${allWords.size.toLocaleString()} English words available`;

    }catch(error){

        status.textContent =
            `${allWords.size} core words available. External word bank could not load.`;

    }

    renderResults("");

}


/* =========================================================
   SEARCH ENGINE
========================================================= */

function searchWords(query){

    query = normalizeWord(query);

    const level =
        document.getElementById("levelFilter").value;

    const pos =
        document.getElementById("posFilter").value;


    /*
       First filter the word list.
    */

    let candidates = [];

    for(const word of allWords){

        const data = wordData.get(word);

        if(level !== "all"){

            if(!data || data.level !== level){
                continue;
            }

        }

        if(pos !== "all"){

            if(!data || data.pos !== pos){
                continue;
            }

        }

        candidates.push(word);

    }


    if(!query){

        return candidates
            .sort((a,b) =>
                a.length - b.length ||
                a.localeCompare(b)
            )
            .slice(0,60);
    }


    /*
       EXACT MATCH
       If user searches "generation",
       generation must come first.
    */

    const exact =
        candidates.filter(w => w === query);

    if(exact.length){

        return exact;

    }


    /*
       PREFIX MATCH
       "gener" -> generation, generate, general...
    */

    const prefix =
        candidates.filter(w =>
            w.startsWith(query)
        );


    if(prefix.length){

        return prefix
            .sort((a,b) =>
                a.length - b.length ||
                a.localeCompare(b)
            )
            .slice(0,80);

    }


    /*
       IMPORTANT:
       We DO NOT show internal substring matches
       when prefix/exact results exist.

       Example:
       generation
       will NOT randomly return
       irregeneration.
    */

    const contains =
        candidates.filter(w =>
            w.includes(query)
        );

    return contains
        .sort((a,b) =>
            a.length - b.length ||
            a.localeCompare(b)
        )
        .slice(0,80);
}


/* =========================================================
   GET BASIC DATA
========================================================= */

function basicData(word){

    if(wordData.has(word)){

        return wordData.get(word);

    }

    return {

        uz:"Translation loading...",
        pos:"English word",
        level:"—",
        definition:"Definition available in Details.",
        example:"Example available in Details.",
        synonyms:"—"

    };

}


/* =========================================================
   RENDER
========================================================= */

function renderResults(query){

    const results =
        document.getElementById("results");

    const words =
        searchWords(query);

    results.innerHTML = "";

    if(!words.length){

        results.innerHTML = `
            <div class="empty">
                <h3>No exact word found</h3>
                <p>Try another spelling.</p>
            </div>
        `;

        return;

    }


    words.forEach(word => {

        const data =
            basicData(word);

        const card =
            document.createElement("article");

        card.className = "word-card";

        card.innerHTML = `

            <div class="word-top">

/* =========================================================
   EXTERNAL DICTIONARY DETAILS
========================================================= */

async function fetchExternalDetails(word){

    const content =
        document.getElementById("modalContent");

    try{

        const response =
            await fetch(
                "https://api.dictionaryapi.dev/api/v2/entries/en/" +
                encodeURIComponent(word)
            );

        if(!response.ok){
            throw new Error("Not found");
        }

        const data =
            await response.json();

        const entry =
            data[0];

        let definition = "";
        let example = "";
        let pos = "";
        let phonetic = "";

        if(entry.phonetic){

            phonetic = entry.phonetic;

        }

        for(const meaning of entry.meanings || []){

            if(!pos){
                pos = meaning.partOfSpeech || "";
            }

            if(
                meaning.definitions &&
                meaning.definitions.length
            ){

                const d =
                    meaning.definitions[0];

                if(!definition){

                    definition =
                        d.definition || "";

                }

                if(!example && d.example){

                    example =
                        d.example;

                }

            }

        }


        let translation =
            "Translation unavailable";

        /*
           Uzbek translation
        */

        try{

            const trResponse =
                await fetch(
                    "https://api.mymemory.translated.net/get?q=" +
                    encodeURIComponent(word) +
                    "&langpair=en|uz"
                );

            if(trResponse.ok){

                const tr =
                    await trResponse.json();

                if(
                    tr.responseData &&
                    tr.responseData.translatedText
                ){

                    translation =
                        tr.responseData.translatedText;

                }

            }

        }catch(e){}


        wordData.set(word,{

            uz:translation,
            pos:pos || "word",
            level:"—",
            definition:
                definition || "No definition found.",
            example:
                example || "No example available.",
            synonyms:"See dictionary details."

        });


        content.innerHTML = `

            <div class="pronunciation-box">

                <div class="pronunciation-title">
                    PRONUNCIATION
                </div>

                <div class="pronunciation-buttons">

                    <button
                        class="us-large"
                        onclick="speakWord(${JSON.stringify(word)},'US')">
                        🇺🇸 American
                    </button>

                    <button
                        class="uk-large"
                        onclick="speakWord(${JSON.stringify(word)},'UK')">
                        🇬🇧 British
                    </button>

                </div>

                <div class="voice-info" id="voiceInfo">
                    Loading available regional voice...
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    Uzbek
                </div>

                <div class="detail-value">
                    ${escapeHTML(translation)}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    Part of Speech
                </div>

                <div class="detail-value">
                    ${escapeHTML(pos || "—")}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    IPA / Phonetic
                </div>

                <div class="detail-value">
                    ${escapeHTML(phonetic || "—")}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    Definition
                </div>

                <div class="detail-value">
                    ${escapeHTML(definition || "—")}
                </div>

            </div>

            <div class="detail-row">

                <div class="detail-label">
                    Example
                </div>

                <div class="detail-value">
                    ${escapeHTML(example || "—")}
                </div>

            </div>

        `;

        updateVoiceInfo();

    }catch(error){

        content.innerHTML = `

            <div class="pronunciation-box">

                <div class="pronunciation-title">
                    PRONUNCIATION
                </div>

                <div class="pronunciation-buttons">

                    <button
                        class="us-large"
                        onclick="speakWord(${JSON.stringify(word)},'US')">
                        🇺🇸 American
                    </button>

                    <button
                        class="uk-large"
                        onclick="speakWord(${JSON.stringify(word)},'UK')">
                        🇬🇧 British
                    </button>

                </div>

            </div>

            <div class="empty">

                <h3>Details unavailable</h3>

                <p>
                    The word was found, but the external dictionary
                    did not return full information.
                </p>

            </div>

        `;

        updateVoiceInfo();

    }

}

function updateVoiceInfo(){

    const box =
        document.getElementById("voiceInfo");

    if(!box) return;

    const us =
        getUSVoice();

    const uk =
        getUKVoice();

    box.innerHTML =
        "🇺🇸 " +
        (us
            ? escapeHTML(us.name)
            : "Browser default en-US voice")
        +
        " &nbsp; | &nbsp; 🇬🇧 " +
        (uk
            ? escapeHTML(uk.name)
            : "Browser default en-GB voice");

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}
